version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: fisiocase_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fisiocase
      POSTGRES_USER: fisiocase
      POSTGRES_PASSWORD: fisiocase123
    ports:
      - "5432:5432"
    volumes:
      - fisiocase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisiocase -d fisiocase"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fisiocase_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fisiocase:fisiocase123@postgres:5432/fisiocase?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      PORT: 3001
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fisiocase_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"

volumes:
  fisiocase_pgdata:
